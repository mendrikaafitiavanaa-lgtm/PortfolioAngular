<app-loading [loading]="loading" [darkMode]="darkMode"></app-loading>

<div *ngIf="!loading">
  <div 
    [ngClass]="darkMode 
      ? 'h-auto md:min-h-screen flex flex-col md:flex-row items-center justify-center md:justify-between bg-black text-white' 
      : 'h-auto md:min-h-screen flex flex-col md:flex-row items-center justify-center md:justify-between bg-white text-black'"
    class="w-full max-w-full overflow-hidden gap-6 px-4 pt-28 pb-12 md:py-0"> <div data-aos="slide-right" data-aos-duration="1500"
        class="md:w-1/2 text-center md:text-left space-y-4 px-2"
        style="max-width: 100%;">
      
      <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold">
        Bonjour, je suis <br class="block sm:hidden" />
        <span class="text-blue-600 block sm:inline">Herinirina Mendrika Fitiavana</span>
      </h1>
      
      <p class="text-base sm:text-xl md:text-2xl font-bold">
        Étudiant en Master 1 à l'université de CNTEMAD, passionné par la programmation en Java.
      </p>

      <div class="flex flex-col sm:flex-row gap-3 justify-center md:justify-start">
        <a href="assets/cv_Mendrika.pdf" download 
           class="px-4 sm:px-6 py-2 sm:py-3 border border-blue-500 text-blue-500 hover:bg-gradient-to-r from-teal-400 via-cyan-500 to-blue-600 hover:text-white rounded-full text-sm sm:text-base transition duration-300">
          Télécharger CV
        </a>
        <a href="#contact" 
           class="px-4 sm:px-6 py-2 sm:py-3 border border-blue-500 text-blue-500 hover:bg-gradient-to-r from-teal-400 via-cyan-500 to-blue-600 hover:text-white rounded-full text-sm sm:text-base transition duration-300">
          Mes contacts
        </a>
      </div>
    </div>

    <div data-aos="slide-left" data-aos-duration="1500"
         class="md:w-1/2 flex justify-center px-2"
         style="max-width: 100%;">
      
      <img [src]="currentImage" alt="Photo Mendrika"
           class="w-56 h-56 sm:w-64 sm:h-64 md:w-96 md:h-96 rounded-full object-cover shadow-lg border-4 border-blue-500"
           style="border-radius: 50% !important; object-fit: cover; max-width: 100%;"
           (mouseenter)="onMouseEnter()" 
           (mouseleave)="onMouseLeave()" />
    </div>
  </div>
</div>
