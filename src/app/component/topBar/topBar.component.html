<div 
  [ngClass]="darkMode ? 'bg-black text-white shadow-md' : 'bg-white text-black shadow-md'"
  class="fixed top-0 left-0 w-full z-[1000]">

  <div class="flex items-center justify-between max-w-7xl mx-auto h-[70px] px-5">
    
    <!-- Logo -->
    <div class="flex items-center gap-2">
      <img src="assets/logo.png" alt="Logo Mendrika" class="h-14 w-14 rounded-full shadow-md" />
    </div>

    <!-- Bouton menu mobile -->
    <button 
      class="md:hidden text-2xl z-[1001]" 
      (click)="toggleMenu()" 
      aria-label="Menu mobile">
      <i [class]="isMenuOpen ? 'fas fa-times' : 'fas fa-bars'"></i>
    </button>

    <!-- Liens navigation -->
    <ul 
      [ngClass]="isMenuOpen ? 'flex' : 'hidden'"
      class="md:flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 
             absolute md:static top-full left-0 w-full md:w-auto py-4 md:py-0 
             shadow-lg md:shadow-none z-[999]"
      [class.bg-black]="darkMode"
      [class.bg-white]="!darkMode">

      <li><a href="#accueil" (click)="closeMenuAndScroll('accueil')" class="nav-link">Accueil</a></li>
      <li><a href="#competence" (click)="closeMenuAndScroll('competence')" class="nav-link">Compétences</a></li>
      <li><a href="#projet" (click)="closeMenuAndScroll('projet')" class="nav-link">Projet</a></li>
      <li><a href="#contact" (click)="closeMenuAndScroll('contact')" class="nav-link">Contact</a></li>
    </ul>

    <!-- Dark mode toggle -->
    <div class="flex items-center gap-4">
      <button (click)="onToggle()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
        <i [ngClass]="darkMode ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-black dark:text-white'"></i>
      </button>
    </div>
  </div>
</div>

<!-- Overlay pour fermer le menu -->
<div *ngIf="isMenuOpen" 
     (click)="closeMenu()"
     class="fixed inset-0 z-[998] top-[70px] bg-black/50">
</div>
