<div *ngIf="loading" class="flex flex-col items-center justify-center py-20">
    <!-- Spinner ngx-spinner -->
    <ngx-spinner
      bdColor="rgba(0,0,0,0.3)"
      size="medium"
      color="#3b82f6"
      type="ball-spin-clockwise">
    </ngx-spinner>
  
    <!-- Icône moderne -->
    <i class="fas fa-sync-alt animate-spin text-blue-500 text-3xl mt-6"></i>
  </div>
