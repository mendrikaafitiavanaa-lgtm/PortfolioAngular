<div class="p-20 space-y-10 ">
    <!-- État de chargement -->
    <div *ngIf="loading" class="text-center py-10">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-700"></div>
        <p class="mt-2" [ngClass]="darkMode ? 'text-white' : 'text-black'">
            Chargement des statistiques...
        </p>
    </div>

    <!-- Message d'erreur -->
    <div *ngIf="error" class="text-center py-10">
        <p class="text-red-500">Erreur lors du chargement des données</p>
        <button (click)="loadCounts()" 
                class="mt-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Réessayer
        </button>
    </div>

    <!-- Contenu principal (affiché seulement si pas de chargement et pas d'erreur) -->
    <ng-container *ngIf="!loading && !error" class="my-30">
        <!-- Cartes compteur -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
            <div [ngClass]="darkMode ? 'bg-gray-800 text-white shadow-gray-900 border-l-4 border-blue-500' 
                                     : 'bg-white text-black shadow-md border-l-4 border-blue-500'"
                 class="rounded-xl p-6 font-bold transition transform hover:scale-105">
                <h2 class="text-lg">Utilisateurs</h2>
                <p class="text-2xl mt-2">{{ counts.utilisateurs }}</p>
            </div>
    
            <div [ngClass]="darkMode ? 'bg-gray-800 text-white shadow-gray-900 border-l-4 border-green-500' 
                                     : 'bg-white text-black shadow-md border-l-4 border-green-500'"
                 class="rounded-xl p-6 font-bold transition transform hover:scale-105">
                <h2 class="text-lg">Voitures</h2>
                <p class="text-2xl mt-2">{{ counts.voitures }}</p>
            </div>
    
            <div [ngClass]="darkMode ? 'bg-gray-800 text-white shadow-gray-900 border-l-4 border-yellow-500' 
                                     : 'bg-white text-black shadow-md border-l-4 border-yellow-500'"
                 class="rounded-xl p-6 font-bold transition transform hover:scale-105">
                <h2 class="text-lg">Catégories</h2>
                <p class="text-2xl mt-2">{{ counts.categories }}</p>
            </div>
    
            <div [ngClass]="darkMode ? 'bg-gray-800 text-white shadow-gray-900 border-l-4 border-purple-500' 
                                     : 'bg-white text-black shadow-md border-l-4 border-purple-500'"
                 class="rounded-xl p-6 font-bold transition transform hover:scale-105">
                <h2 class="text-lg">Clients</h2>
                <p class="text-2xl mt-2">{{ counts.clients }}</p>
            </div>
    
            <div [ngClass]="darkMode ? 'bg-gray-800 text-white shadow-gray-900 border-l-4 border-red-500' 
                                     : 'bg-white text-black shadow-md border-l-4 border-red-500'"
                 class="rounded-xl p-6 font-bold transition transform hover:scale-105">
                <h2 class="text-lg">Factures</h2>
                <p class="text-2xl mt-2">{{ counts.factures }}</p>
            </div>
        </div>
    
      
    </ng-container>
      <!-- Line Chart (affiché seulement si les données sont chargées) -->
<div class="mt-10">
    <app-line-chart *ngIf="counts.utilisateurs > 0 || counts.voitures > 0" 
        [darkMode]="darkMode" 
        class="pt-30"
        [counts]="counts">
    </app-line-chart>
</div>

<!-- Message si toutes les données sont à zéro -->
<div *ngIf="counts.utilisateurs === 0 && counts.voitures === 0 && 
   counts.categories === 0 && counts.clients === 0 && 
   counts.factures === 0"
class="text-center p-10" 
[ngClass]="darkMode ? 'text-gray-400' : 'text-gray-600'">
Aucune donnée disponible pour afficher le graphique
</div>
</div>
