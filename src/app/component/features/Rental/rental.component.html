<div class="p-6 mt-4" [ngClass]="darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-black'">
  <div class="card shadow-2xl max-w-2xl mx-auto mt-10" [ngClass]="darkMode ? 'bg-gray-800 text-white' : 'bg-base-100'">
    <div class="card-body">
      <h2 class="card-title text-primary">🧾 Facture Location Voiture</h2>

      <!-- Sélecteur client -->
      <label for="client">Client :</label>
      <select id="client" [(ngModel)]="selectedClientId" name="client"
              class="w-full rounded-full border p-2 mt-2"
              [ngClass]="darkMode ? 'bg-gray-700 text-white border-blue-400' : 'bg-white text-black border-blue-500'">
        <option *ngFor="let client of clients" [value]="client.id">
          {{ client.nom }} - {{ client.telephone }}
        </option>
      </select>
    </div>
  </div>

  <!-- Tableau -->
  <div class="card shadow-2xl mt-8" [ngClass]="darkMode ? 'bg-gray-800 text-white' : 'bg-base-100'">
    <div class="card-body">
      <div class="overflow-x-auto">
        <table class="table w-full">
          <thead>
            <tr [ngClass]="darkMode ? 'text-white' : 'text-black'">
              <th>Voiture</th>
              <th>Prix/jour</th>
              <th>Date début</th>
              <th>Date fin</th>
              <th>Total ligne</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let rental of rentals; let i = index">
              <td>
                <select [(ngModel)]="rental.carId" name="car{{i}}"
                        class="px-3 py-2 rounded-lg border"
                        [ngClass]="darkMode ? 'bg-gray-700 text-white border-blue-400' : 'bg-white text-black border-blue-500'">
                  <!-- ✅ utiliser ngValue pour garder le type number -->
                  <option *ngFor="let car of cars" [ngValue]="car.id">
                    {{ car.modele }}
                  </option>
                </select>
              </td>
            
              <!-- ✅ Prix/jour reste correct même après sélection -->
              <td>{{ getTarif(rental.carId) }} Ar</td>
            
              <td>
                <input type="date" [(ngModel)]="rental.dateDebut" name="debut{{i}}"
                       class="px-3 py-2 rounded-lg border"
                       [ngClass]="darkMode ? 'bg-gray-700 text-white border-blue-400' : 'bg-white text-black border-blue-500'"/>
              </td>
            
              <td>
                <input type="date" [(ngModel)]="rental.dateFin" name="fin{{i}}"
                       class="px-3 py-2 rounded-lg border"
                       [ngClass]="darkMode ? 'bg-gray-700 text-white border-blue-400' : 'bg-white text-black border-blue-500'"/>
              </td>
            
              <td>{{ calculLigne(rental) }} Ar</td>
            
              <td>
                <button (click)="supprimerLigne(i)"
                        class="btn bg-red-600 btn-sm px-4 py-2 rounded-full">
                  ❌ Supprimer
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <button (click)="ajouterLigne()" class="btn  py-2 my-4 ml-4 bg-green-600 rounded-full mt-4">➕ Ajouter une ligne</button>

      <!-- Totaux -->
      <div class="text-right font-bold mt-4 text-lg">
        Montant total : <span class="text-primary">{{ montantTotal }} Ar</span>
      </div>

      <!-- Boutons action -->
      <div class="mt-6 space-x-4">
        <button (click)="createInvoice()" 
                class="btn py-2 my-4 ml-4 bg-green-600 rounded-full" 
                [disabled]="!selectedClientId || rentals.length === 0">
          💾 Créer facture
        </button>
        <button (click)="updateInvoice()" 
                class="btn py-2 my-4 ml-4 bg-green-600 rounded-full" 
                [disabled]="!factureId">
          ✏️ Mettre à jour facture
        </button>
        <!-- ✅ Bouton impression corrigé -->
        <button (click)="printInvoice()" 
                class="btn py-2 my-4 ml-4 bg-blue-600 rounded-full" 
                [disabled]="!factureId">
          🖨️ Imprimer facture
        </button>
      </div>
      
    </div>
  </div>
</div>
